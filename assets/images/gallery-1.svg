<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="gal1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262320"/>
      <stop offset="50%" stop-color="#342E27"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
    <radialGradient id="gal1Glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EAD9BD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1A1816" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#gal1Bg)"/>
  <rect width="900" height="1100" fill="url(#gal1Glow)"/>
  
  <!-- Architectural Glasshouse Mandap Artwork -->
  <g transform="translate(450, 520)">
    <!-- Glasshouse Arch Structure -->
    <path d="M -300 320 L -300 -60 C -300 -280 300 -280 300 -60 L 300 320" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M -260 320 L -260 -40 C -260 -240 260 -240 260 -40 L 260 320" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="8,6" opacity="0.6"/>
    <line x1="-300" y1="-60" x2="300" y2="-60" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-280" x2="0" y2="320" stroke="#D4AF37" stroke-width="1.2" opacity="0.4"/>
    
    <!-- Cascading Orchids / Floral Clouds -->
    <g fill="#EAD9BD" opacity="0.75">
      <ellipse cx="-180" cy="-60" rx="90" ry="40"/>
      <ellipse cx="180" cy="-60" rx="90" ry="40"/>
      <ellipse cx="0" cy="-140" rx="120" ry="50" fill="#F4ECE1"/>
      <circle cx="-90" cy="-100" r="45"/>
      <circle cx="90" cy="-100" r="45"/>
    </g>

    <!-- Hanging Floral Tendrils -->
    <g stroke="#E8D7B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3,7" opacity="0.8">
      <line x1="-120" y1="-20" x2="-120" y2="150"/>
      <line x1="-60" y1="-10" x2="-60" y2="180"/>
      <line x1="0" y1="0" x2="0" y2="210"/>
      <line x1="60" y1="-10" x2="60" y2="180"/>
      <line x1="120" y1="-20" x2="120" y2="150"/>
    </g>

    <!-- Altar / Sacred Hearth Platform -->
    <polygon points="-220,320 220,320 180,260 -180,260" fill="#2E2822" stroke="#D4AF37" stroke-width="1.5"/>
    <ellipse cx="0" cy="275" rx="70" ry="16" fill="#1C1814" stroke="#EED596" stroke-width="1"/>
    <!-- Floating brass lamps with gentle glow -->
    <circle cx="-130" cy="290" r="5" fill="#FFEAA7"/>
    <circle cx="130" cy="290" r="5" fill="#FFEAA7"/>
  </g>

  <!-- Title / Placement Tag in Image -->
  <g transform="translate(60, 990)">
    <rect x="-10" y="-20" width="460" height="70" fill="#141311" fill-opacity="0.7" rx="4"/>
    <text x="15" y="10" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#F4ECE1">Glasshouse Mandap &amp; Blush Orchids</text>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#D4AF37">PALACE GROUNDS • WEDDINGS</text>
  </g>
</svg>
