<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="gal6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192025"/>
      <stop offset="50%" stop-color="#282E2E"/>
      <stop offset="100%" stop-color="#14181B"/>
    </linearGradient>
    <radialGradient id="gal6Glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFDD99" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14181B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="650" fill="url(#gal6Bg)"/>
  <rect width="900" height="650" fill="url(#gal6Glow)"/>

  <!-- Open Air Festoon Canopy over Lush Lawn -->
  <g transform="translate(450, 360)">
    <!-- Festoon Light Strings Swag -->
    <path d="M -400 -120 Q -200 -30 0 -100 Q 200 -30 400 -120" fill="none" stroke="#E5C788" stroke-width="1.8"/>
    <path d="M -400 -60 Q -200 30 0 -40 Q 200 30 400 -60" fill="none" stroke="#E5C788" stroke-width="1.8"/>
    <circle cx="-300" cy="-60" r="4" fill="#FFF2CC"/>
    <circle cx="-100" cy="-55" r="4.5" fill="#FFF2CC"/>
    <circle cx="100" cy="-55" r="4.5" fill="#FFF2CC"/>
    <circle cx="300" cy="-60" r="4" fill="#FFF2CC"/>

    <!-- Lush Lawn Silhouette and Lounge Seating -->
    <ellipse cx="0" cy="160" rx="380" ry="70" fill="#1C2422" stroke="#4B6358" stroke-width="1"/>
    
    <!-- Pergola Structure with Hanging Wisteria -->
    <path d="M -220 160 L -220 20 L 220 20 L 220 160" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <line x1="-240" y1="20" x2="240" y2="20" stroke="#EED596" stroke-width="3"/>
    
    <!-- Warm uplighting -->
    <polygon points="-220,160 -260,80 -180,80" fill="#FFEAA7" fill-opacity="0.12"/>
    <polygon points="220,160 180,80 260,80" fill="#FFEAA7" fill-opacity="0.12"/>
  </g>

  <!-- Title Tag -->
  <g transform="translate(50, 560)">
    <rect x="-10" y="-20" width="460" height="70" fill="#141311" fill-opacity="0.75" rx="4"/>
    <text x="15" y="10" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#F4ECE1">Open Air Twilight Reception</text>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#D4AF37">KANAKAPURA VALLEY • OUTDOOR</text>
  </g>
</svg>
