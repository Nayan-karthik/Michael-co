<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="servGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26211D" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#181512" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#servGrad3)" />
  <circle cx="400" cy="270" r="220" fill="url(#glassGlow)" />
  
  <!-- Champagne Flutes & Toasting Motif / Intimate Soirée -->
  <g transform="translate(400, 250)" stroke="#D4AF37" fill="none">
    <!-- Starbursts -->
    <path d="M 0 -130 L 0 -100 M -15 -115 L 15 -115" stroke-width="1.5" stroke="#FFEAA7"/>
    <!-- Left Glass -->
    <path d="M -50 -50 C -45 10 -20 30 -20 70 L -20 120 M -45 120 L 5 120" stroke-width="1.8"/>
    <!-- Right Glass -->
    <path d="M 50 -50 C 45 10 20 30 20 70 L 20 120 M -5 120 L 45 120" stroke-width="1.8"/>
    <!-- Clinking sparkles -->
    <circle cx="0" cy="-30" r="3" fill="#FFEAA7"/>
    <circle cx="-15" cy="-70" r="2" fill="#EED596"/>
    <circle cx="20" cy="-60" r="2.5" fill="#EED596"/>
    <!-- Floral surrounding frame -->
    <circle cx="0" cy="25" r="140" stroke-width="1" stroke-dasharray="8,6" opacity="0.4"/>
  </g>
  <text x="400" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#E8D7B8" text-anchor="middle" letter-spacing="2">Family Celebrations</text>
  <text x="400" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#999185" text-anchor="middle" letter-spacing="3">MILESTONES, ANNIVERSARIES &amp; SOIRÉES</text>
</svg>
