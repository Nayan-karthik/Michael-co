<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="gal3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="50%" stop-color="#322822"/>
      <stop offset="100%" stop-color="#191512"/>
    </linearGradient>
    <radialGradient id="gal3Glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#191512" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="650" fill="url(#gal3Bg)"/>
  <rect width="900" height="650" fill="url(#gal3Glow)"/>

  <!-- Candlelit Private Dinner Tablescape Motif -->
  <g transform="translate(450, 360)">
    <!-- Tablescape perspective -->
    <polygon points="-360,180 360,180 220,10 -220,10" fill="#2E2620" stroke="#8C7755" stroke-width="1.2"/>
    <polygon points="-120,180 120,180 60,10 -60,10" fill="#3D332B"/>
    
    <!-- Botanical Centerpiece -->
    <ellipse cx="0" cy="90" rx="140" ry="24" fill="#5E4F3E" opacity="0.8"/>
    
    <!-- Candelabra and Flutes -->
    <line x1="-120" y1="40" x2="-120" y2="90" stroke="#FFEAA7" stroke-width="3"/>
    <circle cx="-120" cy="35" r="5" fill="#FFEAA7"/>
    <line x1="0" y1="20" x2="0" y2="80" stroke="#FFEAA7" stroke-width="3"/>
    <circle cx="0" cy="15" r="6" fill="#FFEAA7"/>
    <line x1="120" y1="40" x2="120" y2="90" stroke="#FFEAA7" stroke-width="3"/>
    <circle cx="120" cy="35" r="5" fill="#FFEAA7"/>
  </g>

  <!-- Title Tag -->
  <g transform="translate(50, 560)">
    <rect x="-10" y="-20" width="460" height="70" fill="#141311" fill-opacity="0.75" rx="4"/>
    <text x="15" y="10" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#F4ECE1">Intimate 50th Milestone Soirée</text>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#D4AF37">INDIRANAGAR • PRIVATE SOIRÉE</text>
  </g>
</svg>
