<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="servGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E22" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <radialGradient id="corpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C59B27" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#servGrad2)" />
  <circle cx="400" cy="270" r="220" fill="url(#corpGlow)" />
  
  <!-- Architectural Geometry / Modern Stage & Summit Lines -->
  <g transform="translate(400, 260)" stroke="#D4AF37" fill="none">
    <polygon points="0,-120 130,80 -130,80" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-90 100,60 -100,60" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="0" cy="-20" r="45" stroke="#EED596" stroke-width="1.8"/>
    <line x1="-160" y1="120" x2="160" y2="120" stroke="#FFEAA7" stroke-width="2"/>
    <line x1="-110" y1="140" x2="110" y2="140" stroke="#8C7755" stroke-width="1"/>
    
    <!-- Accent lights -->
    <circle cx="0" cy="-120" r="4" fill="#FFEAA7"/>
    <circle cx="-130" cy="80" r="4" fill="#FFEAA7"/>
    <circle cx="130" cy="80" r="4" fill="#FFEAA7"/>
  </g>
  <text x="400" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#E8D7B8" text-anchor="middle" letter-spacing="2">Corporate Events</text>
  <text x="400" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#999185" text-anchor="middle" letter-spacing="3">SUMMITS, GALAS &amp; BRAND LAUNCHES</text>
</svg>
