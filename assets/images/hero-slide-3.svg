<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181B" />
      <stop offset="45%" stop-color="#22201D" />
      <stop offset="100%" stop-color="#181512" />
    </linearGradient>
    <radialGradient id="fairyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFDD99" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad3)" />
  <rect width="1600" height="900" fill="url(#fairyGlow)" />

  <!-- Overhead Cascading Canopy of Fairy Lights -->
  <g opacity="0.85">
    <path d="M 0 60 Q 400 160 800 80 Q 1200 160 1600 70" fill="none" stroke="#E5C788" stroke-width="0.8" opacity="0.4"/>
    <path d="M 0 120 Q 400 230 800 150 Q 1200 230 1600 130" fill="none" stroke="#E5C788" stroke-width="0.8" opacity="0.4"/>
    <path d="M 0 180 Q 400 300 800 220 Q 1200 300 1600 190" fill="none" stroke="#E5C788" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Sparkle dots -->
    <circle cx="210" cy="115" r="3.5" fill="#FFF2CC" filter="drop-shadow(0 0 4px #FFD700)"/>
    <circle cx="340" cy="145" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 0 5px #FFD700)"/>
    <circle cx="510" cy="160" r="3" fill="#FFF2CC"/>
    <circle cx="680" cy="130" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 5px #FFD700)"/>
    <circle cx="850" cy="110" r="3.5" fill="#FFF2CC"/>
    <circle cx="1020" cy="155" r="4" fill="#FFFFFF" filter="drop-shadow(0 0 5px #FFD700)"/>
    <circle cx="1190" cy="180" r="3" fill="#FFF2CC"/>
    <circle cx="1360" cy="140" r="4.5" fill="#FFFFFF" filter="drop-shadow(0 0 5px #FFD700)"/>
    
    <circle cx="280" cy="200" r="3" fill="#FFEAA7"/>
    <circle cx="480" cy="245" r="3.5" fill="#FFEAA7"/>
    <circle cx="750" cy="210" r="4" fill="#FFFFFF"/>
    <circle cx="940" cy="235" r="3.5" fill="#FFEAA7"/>
    <circle cx="1140" cy="240" r="3" fill="#FFEAA7"/>
  </g>

  <!-- Long Luxury Banquet Tablescape (Perspective) -->
  <g transform="translate(800, 560)">
    <!-- Table Surface -->
    <polygon points="-580,240 580,240 320,10 -320,10" fill="#2E2822" stroke="#8C7755" stroke-width="1.2"/>
    <!-- Linen Runner -->
    <polygon points="-160,240 160,240 80,10 -80,10" fill="#423A31" opacity="0.9"/>

    <!-- Floral Centrepiece Line -->
    <path d="M -60 20 L -120 220" stroke="#7A684C" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <path d="M 60 20 L 120 220" stroke="#7A684C" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="0" cy="180" rx="90" ry="22" fill="#5E5343" opacity="0.7"/>
    <ellipse cx="0" cy="80" rx="60" ry="16" fill="#5E5343" opacity="0.7"/>

    <!-- Tapered Candles & Warm Flame Glow -->
    <g transform="translate(-70, 140)">
      <rect x="-2" y="-35" width="4" height="35" fill="#EDE4D8"/>
      <ellipse cx="0" cy="-40" rx="3" ry="7" fill="#FFEAA7"/>
      <circle cx="0" cy="-40" r="9" fill="#FFA502" opacity="0.3"/>
    </g>
    <g transform="translate(70, 140)">
      <rect x="-2" y="-35" width="4" height="35" fill="#EDE4D8"/>
      <ellipse cx="0" cy="-40" rx="3" ry="7" fill="#FFEAA7"/>
      <circle cx="0" cy="-40" r="9" fill="#FFA502" opacity="0.3"/>
    </g>
    <g transform="translate(0, 50)">
      <rect x="-2" y="-30" width="4" height="30" fill="#EDE4D8"/>
      <ellipse cx="0" cy="-34" rx="2.5" ry="6" fill="#FFEAA7"/>
      <circle cx="0" cy="-34" r="8" fill="#FFA502" opacity="0.3"/>
    </g>
  </g>

  <!-- Editorial Badge Watermark -->
  <g transform="translate(1420, 820)" text-anchor="end">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#D4AF37">PHOTO: CANDLELIT PRIVATE GARDEN SOIRÉE</text>
    <text y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="2" fill="#999185">INDIRANAGAR ESTATE, BENGALURU</text>
  </g>
</svg>
