<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="gal2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B20"/>
      <stop offset="60%" stop-color="#23272E"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="gal2Glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="650" fill="url(#gal2Bg)"/>
  <rect width="900" height="650" fill="url(#gal2Glow)"/>

  <!-- High-End Corporate Gala Stage & Immersive Curved Backdrop -->
  <g transform="translate(450, 360)">
    <!-- Stage Arch Curved Ribbon -->
    <path d="M -360 120 C -250 -100 250 -100 360 120" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
    <path d="M -320 120 C -220 -70 220 -70 320 120" fill="none" stroke="#EED596" stroke-width="1" stroke-dasharray="6,4"/>
    
    <!-- Stage Deck -->
    <polygon points="-380,140 380,140 420,180 -420,180" fill="#202328" stroke="#D4AF37" stroke-width="1.2"/>
    <polygon points="-340,100 340,100 375,138 -375,138" fill="#2A2E35"/>

    <!-- Dynamic Stage Beams -->
    <polygon points="-280,-140 -340,100 -200,100" fill="#FFEAA7" fill-opacity="0.08"/>
    <polygon points="280,-140 200,100 340,100" fill="#FFEAA7" fill-opacity="0.08"/>
    <polygon points="0,-160 -100,100 100,100" fill="#FFEAA7" fill-opacity="0.12"/>
  </g>

  <!-- Title / Placement Tag in Image -->
  <g transform="translate(50, 560)">
    <rect x="-10" y="-20" width="450" height="70" fill="#141311" fill-opacity="0.75" rx="4"/>
    <text x="15" y="10" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#F4ECE1">Tech Leadership Summit &amp; Gala</text>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#D4AF37">UB CITY • CORPORATE</text>
  </g>
</svg>
