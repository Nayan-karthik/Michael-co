<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="servGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2822" />
      <stop offset="100%" stop-color="#1B1916" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EED596" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1B1916" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#servGrad1)" />
  <circle cx="400" cy="270" r="220" fill="url(#ringGlow)" />
  
  <!-- Interlocking Eternal Bands & Floral Vines -->
  <g transform="translate(400, 260)" stroke="#D4AF37" fill="none">
    <!-- Wedding Arch Outline -->
    <path d="M -180 180 L -180 -20 C -180 -140, 180 -140, 180 -20 L 180 180" stroke-width="1.5" opacity="0.4" />
    <circle cx="-50" cy="0" r="70" stroke-width="2" opacity="0.85" />
    <circle cx="50" cy="0" r="70" stroke-width="2" opacity="0.85" />
    <!-- Botanical garland accents -->
    <path d="M -190 40 Q -150 -60 -110 -10 Q -60 -100 0 -130 Q 60 -100 110 -10 Q 150 -60 190 40" stroke="#F5EDE0" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.7"/>
    <!-- Rose buds -->
    <circle cx="-110" cy="-10" r="5" fill="#EED596"/>
    <circle cx="0" cy="-130" r="7" fill="#EED596"/>
    <circle cx="110" cy="-10" r="5" fill="#EED596"/>
  </g>
  <text x="400" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#E8D7B8" text-anchor="middle" letter-spacing="2">Weddings &amp; Engagements</text>
  <text x="400" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#999185" text-anchor="middle" letter-spacing="3">BESPOKE MANDAPS &amp; RECEPTIONS</text>
</svg>
