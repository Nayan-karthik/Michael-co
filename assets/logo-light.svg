<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="440" height="80">
  <defs>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="50%" stop-color="#F7E7BE"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>

  <!-- Monogram Crest -->
  <g transform="translate(6, 4)">
    <circle cx="36" cy="36" r="32" fill="none" stroke="url(#goldGradLight)" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="28" fill="none" stroke="#FAF8F5" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.3"/>
    
    <text x="36" y="45" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#FAF8F5" text-anchor="middle" letter-spacing="0.5">M</text>
    
    <circle cx="36" cy="11" r="2" fill="#EED596"/>
    <path d="M 28 61 Q 36 57 44 61" stroke="url(#goldGradLight)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Wordmark & Subtitle -->
  <g transform="translate(88, 12)">
    <text x="0" y="32" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="29" font-weight="600" letter-spacing="3" fill="#FFFFFF">
      MICHAEL <tspan fill="url(#goldGradLight)" font-weight="400" font-style="italic">&amp;</tspan> CO.
    </text>
    <text x="1" y="50" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#B5ADA1">
      EVENTS &amp; BESPOKE STYLING • BENGALURU
    </text>
  </g>
</svg>
